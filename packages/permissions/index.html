<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permissions</title>
</head>

<body>

  <table border="1" width="500">
    <thead>
      <tr>
        <th colspan="2">
          <h3>PermissionsAPI</h3>
        </th>
      </tr>
      <tr>
        <th>Parameter</th>
        <th>Value</th>
      </tr>
    </thead>

    <body>
      <tr>
        <td>isSupported</td>
        <td><span id="support"></span></td>
      </tr>
      <tr>
        <td>permissionNames</td>
        <td><span id="names"></span></td>
      </tr>
      <tr>
        <td>permission</td>
        <td>
          <select style="width: 100%;" id="select">
            <option disabled selected>Select permission...</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>permissionState</td>
        <td><span id="state">-</span></td>
      </tr>
      <tr>
        <td>permissionError</td>
        <td><span id="error">-</span></td>
      </tr>
    </body>
  </table>

  <script type="module">
    import { PermissionsAPI } from './dist/permissions.js'

    document.querySelector('#support').textContent = PermissionsAPI.isSupported().toString()
    const { permissionNames } = PermissionsAPI
    document.querySelector('#names').innerHTML = '<code>' + permissionNames.join('</code>, <code>') + '</code>'

    const select = document.querySelector('#select')
    permissionNames.forEach(name => {
      const option = document.createElement('option')
      option.value = name
      option.textContent = name
      select.appendChild(option)
    });
    select.addEventListener('change', (event) => {
      const name = event.target.value
      const userVisibleOnly = name === 'push' ? true : undefined;
      const state = document.querySelector('#state')
      const error = document.querySelector('#error')
      state.textContent = '-'
      error.textContent = '-'
      if (name && permissionNames.includes(name)) {
        const handle = PermissionsAPI.getPermissionHandler({ name, userVisibleOnly }, {
          granted: (permission) => {
            console.log('Permission Granted:', permission)
            state.textContent = permission.state
          },
          denied: (permission) => {
            console.log('Permission Denied:', permission)
            state.textContent = permission.state
          },
          error: (permission) => {
            console.log('Permission Error:', permission)
            state.textContent = permission.state
            error.textContent = permission.name + ': ' + permission.message
          }
        })
        handle.onPermissionChange((permission) => {
          console.log('Permission Change:', permission)
          state.textContent = permission.state + ' *'
        })
        handle()
      }
    })
  </script>
</body>

</html>
